[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akashic"
dynamic = ["version"]
description = "Various LLM agents."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Richard Dow", email = "trippdow@gmail.com" }]
keywords = ["NLP", "LLM", "Agentic AI"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "numpy>=1.23",
  "torch>=2.2,<3",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "pymupdf",
  "python-dotenv",
  "model2vec",
  "tiktoken",
  "pymupdf4llm",
  "sentence-transformers",
  "llama-cpp-python",
  "flask",
  "flask-markdown",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "black", "mypy", "build", "twine", "pre-commit"]

[project.urls]
Homepage = "https://github.com/prettytrippy/Akashic"
Issues = "https://github.com/prettytrippy/Akashic/issues"

[tool.setuptools]
package-dir = { "" = "akashic" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
